<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="650" viewBox="0 0 1000 650"
     role="img" aria-labelledby="title desc">
  <title id="title">Gandalf duels the Balrog on the Bridge of Khazad-dûm</title>
  <desc id="desc">
    Above a fiery abyss, Gandalf raises a blue-white staff against a towering,
    horned Balrog. Flames dance, a fiery whip lashes, and magic pulses across
    the narrow stone bridge.
  </desc>

  <defs>
    <linearGradient id="background" x2="0" y2="1">
      <stop stop-color="#060913"/>
      <stop offset=".6" stop-color="#15121c"/>
      <stop offset="1" stop-color="#591a13"/>
    </linearGradient>

    <radialGradient id="abyss">
      <stop stop-color="#ffae46" stop-opacity=".85"/>
      <stop offset=".35" stop-color="#e34716" stop-opacity=".45"/>
      <stop offset="1" stop-color="#6c0b08" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="fireAura">
      <stop stop-color="#ffbc49" stop-opacity=".65"/>
      <stop offset=".4" stop-color="#ff4c11" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ff3300" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="magicAura">
      <stop stop-color="#efffff" stop-opacity=".85"/>
      <stop offset=".16" stop-color="#9defff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#369bff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="fire" x2=".15" y2="1">
      <stop stop-color="#fff8bc"/>
      <stop offset=".3" stop-color="#ffc148"/>
      <stop offset=".65" stop-color="#ff5915"/>
      <stop offset="1" stop-color="#a82013"/>
    </linearGradient>

    <linearGradient id="robe" x2="1" y2=".4">
      <stop stop-color="#354354"/>
      <stop offset=".5" stop-color="#818d99"/>
      <stop offset="1" stop-color="#d2e4e8"/>
    </linearGradient>

    <linearGradient id="stone" x2="0" y2="1">
      <stop stop-color="#77777b"/>
      <stop offset=".13" stop-color="#45434c"/>
      <stop offset="1" stop-color="#1a1923"/>
    </linearGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>

    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <g id="ember">
      <path d="M0 4 Q-3 0 0-5 Q3 0 0 4" fill="#ffb750"/>
    </g>
  </defs>

  <style>
    .aura { animation: aura 2.4s ease-in-out infinite; }
    .fire-flicker {
      animation: flicker .85s ease-in-out infinite alternate;
      transform-box: fill-box;
      transform-origin: 50% 100%;
    }
    .fire-back { animation-delay: -.4s; }
    .monster {
      animation: breathe 3.8s ease-in-out infinite;
      transform-origin: 641px 440px;
    }
    .cloak {
      animation: cloak 2s ease-in-out infinite alternate;
      transform-origin: 367px 361px;
    }
    .whip {
      animation: lash 2.7s ease-in-out infinite;
      transform-origin: 746px 316px;
    }
    .magic { animation: magic 2.7s ease-in-out infinite; }
    .shock {
      animation: shock 2.7s ease-out infinite;
      transform-origin: 481px 296px;
    }
    .rune { animation: rune 2.7s ease-in-out infinite; }
    .ember { animation: rise var(--time, 5s) linear infinite; }
    .mist { animation: drift 13s ease-in-out infinite alternate; }

    @keyframes aura {
      0%,100% { opacity:.55; }
      50% { opacity:1; }
    }
    @keyframes flicker {
      0% { transform:scale(.98,.94) skewX(-2deg); opacity:.8; }
      55% { transform:scale(1.025,1.05) skewX(1deg); opacity:1; }
      100% { transform:scale(1,.98) skewX(-1deg); opacity:.9; }
    }
    @keyframes breathe {
      0%,100% { transform:translateY(0) rotate(-.7deg); }
      50% { transform:translateY(-5px) rotate(.7deg); }
    }
    @keyframes cloak {
      from { transform:skewX(-3deg); }
      to { transform:skewX(4deg); }
    }
    @keyframes lash {
      0%,100% { transform:rotate(3deg); }
      42% { transform:rotate(-5deg); }
      52% { transform:rotate(0deg); }
      65% { transform:rotate(-2deg); }
    }
    @keyframes magic {
      0%,35%,100% { opacity:.45; }
      45%,55% { opacity:1; }
      50% { opacity:.7; }
      70% { opacity:.65; }
    }
    @keyframes shock {
      0%,39% { transform:scale(.2); opacity:0; }
      45% { opacity:.95; }
      75%,100% { transform:scale(2.8); opacity:0; }
    }
    @keyframes rune {
      0%,35%,100% { opacity:.15; }
      48% { opacity:.95; }
      70% { opacity:.35; }
    }
    @keyframes rise {
      0% { transform:translate(0,35px); opacity:0; }
      15% { opacity:1; }
      85% { opacity:.7; }
      100% { transform:translate(-55px,-340px); opacity:0; }
    }
    @keyframes drift {
      from { transform:translateX(-30px); opacity:.2; }
      to { transform:translateX(35px); opacity:.4; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation:none !important; }
      .shock { display:none; }
    }
  </style>

  <!-- Vast, ruined halls -->
  <path fill="url(#background)" d="M0 0H1000V650H0Z"/>
  <ellipse cx="580" cy="651" rx="590" ry="300" fill="url(#abyss)"
           class="aura"/>

  <g fill="#10131f" stroke="#242332" stroke-width="2">
    <path d="M55 0H133L127 359 110 383H66Z"/>
    <path d="M197 0H251L248 320 235 351H208Z"/>
    <path d="M818 0H878L871 350 838 371Z"/>
    <path d="M926 0H992V398L954 365Z"/>
    <path d="M282 0H326L320 245H289Z" opacity=".5"/>
    <path d="M733 0H775L768 266H745Z" opacity=".5"/>
  </g>

  <g fill="none" stroke="#30303c" opacity=".35">
    <path d="M130 145Q467-173 838 146" stroke-width="26"/>
    <path d="M250 93Q488-109 745 91" stroke-width="13"/>
    <path d="M84 10V333M222 0V308M852 0V324M962 0V334"/>
  </g>

  <g fill="#090c14">
    <path d="M0 367L59 379 104 413 121 473 88 533 103 650H0Z"/>
    <path d="M1000 358L942 376 886 421 883 484 918 516 899 650H1000Z"/>
    <path d="M0 551L142 576 177 650H0Z"/>
    <path d="M1000 541L838 582 792 650H1000Z"/>
  </g>

  <g class="mist" fill="none" stroke="#77758b"
     stroke-width="22" filter="url(#softGlow)">
    <path d="M-70 400Q150 320 322 383T712 371T1080 342"/>
    <path d="M-80 522Q199 463 409 523T1080 475"/>
  </g>

  <!-- Balrog's fire and enormous smoky wings -->
  <ellipse cx="650" cy="317" rx="250" ry="231"
           fill="url(#fireAura)" class="aura"/>

  <g class="monster">
    <g fill="#120f17" stroke="#7e2a20" stroke-width="2">
      <path d="M607 282
               C541 177 448 174 378 101
               C406 191 425 242 475 282
               L450 244 519 288 500 255 571 313Z"/>
      <path d="M672 271
               C737 155 827 163 909 86
