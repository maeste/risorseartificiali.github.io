    <path d="M414 427L423 441 417 452M539 427L530 439 548 451"/>
    <path d="M680 429L670 442 679 453M813 431L799 445 810 456"/>
    <path d="M353 428L366 434 359 442M750 431L739 438 746 446"/>
  </g>
  <path d="M82 435L103 464 94 477 68 459Z" fill="#302b32"/>
  <path d="M916 434L935 427 927 457 901 463Z" fill="#302b32"/>

  <!-- Gandalf, small but unyielding -->
  <ellipse cx="389" cy="434" rx="57" ry="7" fill="#080b13" opacity=".7"/>
  <ellipse cx="433" cy="299" rx="117" ry="142"
           fill="url(#magicAura)" opacity=".45" class="magic"/>

  <path class="cloak"
        d="M370 351Q342 360 325 383L291 414
