    <g fill="none" stroke="#f15b24" opacity=".33">
      <path d="M605 284Q494 211 390 116M677 280Q778 195 895 108"/>
      <path d="M561 270L500 221M719 265L795 211"/>
    </g>

    <g class="fire-flicker fire-back" fill="url(#fire)"
       filter="url(#glow)">
      <path d="M571 370
        Q532 327 560 281 Q543 255 563 222
        Q570 254 585 247 Q572 201 599 162
        Q593 201 614 218 Q627 181 613 127
        Q652 164 645 204 Q672 175 664 147
        Q699 185 683 231 Q714 209 717 185
        Q735 237 713 266 Q744 282 726 327
        L711 390Z"/>
      <path d="M593 430Q562 410 566 372L588 386
