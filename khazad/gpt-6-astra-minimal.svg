  <path d="M375 346L397 347 405 387 420 432
           Q397 442 351 431L364 391Z"
        fill="url(#robe)" stroke="#26313e" stroke-width="2"/>
  <g fill="none" stroke="#d0dee3" opacity=".4">
    <path d="M381 373L368 424M391 381L394 432M398 396L407 428"/>
  </g>
  <path d="M355 433L374 432 374 439 350 439Z
           M399 433L414 431 426 438 401 440Z" fill="#252b35"/>

  <!-- Staff arm -->
  <path d="M393 352L408 361 432 337 441 346
           414 379 393 370Z"
        fill="#96a8b5" stroke="#384a5b" stroke-width="2"/>
  <path d="M429 340L437 333 445 337 442 347 435 350Z" fill="#ddc9ba"/>

  <!-- Sword arm and Glamdring -->
  <path d="M371 356L353 376 337 365 330 375
           354 390 379 370Z"
        fill="#6e7e8e" stroke="#344354" stroke-width="2"/>
  <path d="M337 365L329 358 323 364 331 376 338 373Z" fill="#ddc9ba"/>
  <path d="M328 366L270 306 313 369Z"
        fill="#d4f7ff" stroke="#78bddd" stroke-width="1.5"/>
  <path d="M313 372L337 353" stroke="#b2c6d4" stroke-width="4"/>
  <path d="M329 366L340 379" stroke="#4b403b" stroke-width="5"/>

  <!-- Face, hair, and pointed grey hat -->
  <path d="M372 322Q382 310 394 320L396 338
           386 349 372 339Z" fill="#d4c7bb"/>
  <path d="M373 321Q362 339 370 359L380 348 376 331Z" fill="#ced4d6"/>
  <path d="M378 335L387 340 395 333
           Q400 360 384 378L379 359 374 363Z"
        fill="#e2e9e8"/>
  <path d="M379 341L385 360M391 343L387 366"
        fill="none" stroke="#a1afb7" stroke-width="1.5"/>
  <path d="M359 324L374 311 384 274 393 303 401 322
           Q382 332 354 331Z"
        fill="#8695a3" stroke="#354451" stroke-width="2"/>
  <path d="M357 326Q382 329 406 322"
        fill="none" stroke="#c7d7dd" stroke-width="2"/>
  <path d="M390 329L395 330" stroke="#303946" stroke-width="2"/>

  <!-- Staff and its living light -->
  <path d="M433 433L445 293" stroke="#392f2c" stroke-width="7"
        stroke-linecap="round"/>
  <path d="M434 431L446 293" stroke="#b4bfc0" stroke-width="2"/>
  <path d="M445 299L438 287 441 273 447 281
           453 269 458 283 451 299Z"
        fill="#d6e7ec" stroke="#a1c2d3" stroke-width="2"/>

  <g class="magic">
    <circle cx="448" cy="282" r="46" fill="url(#magicAura)"/>
    <circle cx="448" cy="282" r="8" fill="#fff" filter="url(#glow)"/>
    <path d="M448 258V306M425 282H471"
          stroke="#e9ffff" stroke-width="2" filter="url(#glow)"/>
    <path d="M455 284L468 278 477 293 492 289 505 305"
          fill="none" stroke="#dcffff" stroke-width="3" filter="url(#glow)"/>
  </g>

  <!-- The whip curls down into the wizard's magical ward -->
  <g class="whip" fill="none" stroke-linecap="round">
    <path d="M745 318
             C827 292 850 219 800 181
             C750 141 661 170 588 148
             C508 124 465 147 459 187
             C449 230 493 248 502 277
             Q510 296 483 297"
          stroke="#f54013" stroke-width="12" opacity=".38" filter="url(#glow)"/>
    <path d="M745 318
             C827 292 850 219 800 181
             C750 141 661 170 588 148
             C508 124 465 147 459 187
             C449 230 493 248 502 277
             Q510 296 483 297"
          stroke="#ff8f28" stroke-width="5" filter="url(#smallGlow)"/>
    <path d="M745 318
             C827 292 850 219 800 181
             C750 141 661 170 588 148
             C508 124 465 147 459 187
             C449 230 493 248 502 277
             Q510 296 483 297"
          stroke="#fff2b0" stroke-width="1.7"/>
  </g>

  <!-- Clash: expanding ring, ward, and hot sparks -->
  <circle class="shock" cx="481" cy="296" r="21"
          fill="none" stroke="#d4faff" stroke-width="2" filter="url(#smallGlow)"/>

  <g class="magic" fill="none" filter="url(#glow)">
    <path d="M461 233Q509 297 462 377"
          stroke="#9deaff" stroke-width="3"/>
    <path d="M467 244Q504 299 468 365"
          stroke="#fff" stroke-width="1"/>
    <path d="M480 296L467 307 479 321 465 333
             M485 298L510 318 518 315 536 331"
          stroke="#bdefff" stroke-width="2"/>
    <path d="M481 296L496 280M487 304L508 308M479 286L481 270"
          stroke="#fff3ce" stroke-width="2"/>
    <circle cx="482" cy="297" r="5" fill="#fff"/>
  </g>

  <ellipse class="rune" cx="402" cy="431" rx="58" ry="6"
           fill="none" stroke="#9ce8ff" stroke-width="2" filter="url(#glow)"/>

  <!-- Embers climbing out of the chasm -->
  <g filter="url(#smallGlow)">
    <g transform="translate(201 584)">
      <use href="#ember" class="ember" style="--time:6s;animation-delay:-2s"/>
    </g>
    <g transform="translate(340 630)">
      <use href="#ember" class="ember" style="--time:5s;animation-delay:-4s"/>
    </g>
    <g transform="translate(478 575)">
      <use href="#ember" class="ember" style="--time:4s;animation-delay:-1s"/>
    </g>
    <g transform="translate(558 648)">
      <use href="#ember" class="ember" style="--time:6s;animation-delay:-3s"/>
    </g>
    <g transform="translate(631 543)">
      <use href="#ember" class="ember" style="--time:4.5s;animation-delay:-2s"/>
    </g>
    <g transform="translate(738 607)">
      <use href="#ember" class="ember" style="--time:5.5s;animation-delay:-4s"/>
    </g>
    <g transform="translate(836 568)">
      <use href="#ember" class="ember" style="--time:4.8s;animation-delay:-1s"/>
    </g>
    <g transform="translate(697 359)">
      <use href="#ember" class="ember" style="--time:3s;animation-delay:-2s"/>
    </g>
    <g transform="translate(603 336)">
      <use href="#ember" class="ember" style="--time:3.5s;animation-delay:-1s"/>
    </g>
  </g>

  <!-- Falling chips beneath the ancient bridge -->
  <g fill="#6f4c43" opacity=".7">
    <path d="M415 481L420 478 424 485 418 489Z"/>
    <path d="M549 525L556 522 559 533 552 536Z"/>
    <path d="M731 477L736 482 731 487 727 481Z"/>
    <path d="M314 555L318 551 322 557 319 562Z"/>
  </g>
</svg>