      <path d="M680 429Q717 398 708 365L689 383
               Q700 342 678 323L658 425Z"/>
    </g>

    <!-- Obsidian body -->
    <g fill="#1a1419" stroke="#8d3020" stroke-width="2.5"
       stroke-linejoin="round">
      <path d="M606 260L577 283 565 323 589 353
               600 384 581 430 603 440 630 398
               641 359 650 394 674 440 703 437
               677 377 692 336 704 292 676 265Z"/>
      <path d="M583 284L551 302 523 285 514 299
               548 330 579 320 599 297Z"/>
      <path d="M693 284L720 297 748 313 741 334
               704 326 677 305Z"/>
      <path d="M614 232L601 246 612 280 639 296
               668 274 677 243 658 227Z"/>

      <!-- Sweeping horns -->
      <path d="M615 240Q567 233 574 194
               Q577 181 591 172
               Q583 207 625 222Z"/>
      <path d="M657 232Q708 216 696 183
               Q719 194 717 215Q711 243 666 249Z"/>
    </g>

    <!-- Molten fissures and burning eyes -->
    <g fill="none" stroke="#ff7e28" stroke-width="3"
       filter="url(#smallGlow)">
      <path d="M617 291L629 313 619 331 639 354"/>
      <path d="M660 286L648 310 660 328 651 348"/>
      <path d="M594 300L583 313M680 305L672 326"/>
      <path d="M614 385L603 413M665 385L679 416"/>
    </g>
    <g fill="#fff3a0" filter="url(#glow)">
      <path d="M615 248L631 252 628 257 618 255Z"/>
      <path d="M645 252L662 246 658 255 647 257Z"/>
    </g>
    <path d="M627 272L637 277 650 268 642 285Z"
          fill="#ffab37" filter="url(#smallGlow)"/>
  </g>

  <!-- Narrow bridge above the abyss -->
  <path d="M82 434Q470 420 916 434L901 459
           Q469 447 98 463Z" fill="url(#stone)" stroke="#1c1b24" stroke-width="3"/>
  <path d="M85 434Q470 420 916 434"
        fill="none" stroke="#b2a099" stroke-width="3"/>

  <g fill="none" stroke="#171821" stroke-width="2" opacity=".85">
