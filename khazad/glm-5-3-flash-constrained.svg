<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <radialGradient id="chasmGlow" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#ff6a00" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#c22a00" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a0500" stop-opacity="0.1"/>
    </radialGradient>
    <linearGradient id="rockGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4440"/>
      <stop offset="100%" stop-color="#1c1816"/>
    </linearGradient>
    <radialGradient id="auraGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8c1a" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#e03a00" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e03a00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="staffGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#cfe8ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9fc8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur6" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background: dark cavern walls -->
  <rect width="900" height="600" fill="#0d0a0a"/>
  <path d="M0,0 L900,0 L900,140 Q700,80 500,120 Q250,70 0,150 Z" fill="#141010"/>
  <ellipse cx="200" cy="100" rx="120" ry="50" fill="#1a1414"/>
  <ellipse cx="720" cy="110" rx="140" ry="60" fill="#1a1414"/>

  <!-- Chasm: fiery depths with flickering glow -->
  <g id="chasm">
    <rect x="0" y="430" width="900" height="170" fill="#2a0800"/>
    <rect x="0" y="430" width="900" height="170" fill="url(#chasmGlow)" filter="url(#blur6)">
      <animate attributeName="opacity" values="0.7;1;0.75;0.95;0.7" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <!-- lava bubbles / flame tongues -->
    <g id="flameTongues">
      <path d="M80,600 Q90,520 100,600" fill="#ff7b1a" opacity="0.8">
        <animate attributeName="d" values="M80,600 Q90,520 100,600;M80,600 Q85,480 100,600;M80,600 Q90,520 100,600" dur="1.7s" repeatCount="indefinite"/>
      </path>
      <path d="M180,600 Q195,500 210,600" fill="#ffb43a" opacity="0.7">
        <animate attributeName="d" values="M180,600 Q195,500 210,600;M180,600 Q190,470 210,600;M180,600 Q195,500 210,600" dur="1.3s" repeatCount="indefinite"/>
      </path>
      <path d="M430,600 Q445,480 460,600" fill="#ff7b1a" opacity="0.75">
        <animate attributeName="d" values="M430,600 Q445,480 460,600;M430,600 Q440,450 460,600;M430,600 Q445,480 460,600" dur="1.9s" repeatCount="indefinite"/>
      </path>
      <path d="M640,600 Q655,510 670,600" fill="#ffb43a" opacity="0.7">
        <animate attributeName="d" values="M640,600 Q655,510 670,600;M640,600 Q650,470 670,600;M640,600 Q655,510 670,600" dur="1.5s" repeatCount="indefinite"/>
      </path>
      <path d="M810,600 Q820,530 830,600" fill="#ff7b1a" opacity="0.8">
        <animate attributeName="d" values="M810,600 Q820,530 830,600;M810,600 Q815,490 830,600;M810,600 Q820,530 830,600" dur="2.1s" repeatCount="indefinite"/>
      </path>
      <!-- rising embers -->
      <circle cx="140" cy="560" r="2.5" fill="#ffcc66">
        <animate attributeName="cy" values="570;430" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="480" cy="570" r="2" fill="#ffaa33">
        <animate attributeName="cy" values="575;420" dur="3.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="3.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="760" cy="555" r="2.5" fill="#ffcc66">
        <animate attributeName="cy" values="565;440" dur="2.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="2.3s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- bridge abutments on cliffs -->
    <path d="M0,600 L0,380 Q60,370 90,400 L110,600 Z" fill="url(#rockGrad)"/>
    <path d="M900,600 L900,380 Q840,370 810,400 L790,600 Z" fill="url(#rockGrad)"/>
  </g>

  <!-- Bridge of Khazad-dum -->
  <g id="bridge">
    <path d="M95,430 Q450,398 805,430 L805,462 Q450,432 95,462 Z" fill="url(#rockGrad)" stroke="#0c0a09" stroke-width="2"/>
    <path d="M120,462 Q450,434 780,462 L780,486 Q450,458 120,486 Z" fill="#221d1a"/>
    <!-- cracks -->
    <path d="M300,420 l14,3 -10,6 16,3" stroke="#0c0a09" stroke-width="1.5" fill="none"/>
    <path d="M560,424 l-14,4 12,5 -14,4" stroke="#0c0a09" stroke-width="1.5" fill="none"/>
    <!-- flickering lava light on bridge top -->
    <ellipse cx="450" cy="418" rx="330" ry="14" fill="#ff7b1a" opacity="0.28" filter="url(#blur2)">
      <animate attributeName="opacity" values="0.2;0.4;0.22;0.38;0.2" dur="2.4s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Balrog with flaming aura, wings, horns -->
  <g id="balrog">
    <animateTransform attributeName="transform" type="translate" values="0 0; -14 4; 0 0" dur="3.6s" repeatCount="indefinite" additive="sum"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 700 330; -4 700 330; 0 700 330" dur="3.6s" repeatCount="indefinite"/>
      <!-- flaming aura -->
      <ellipse cx="700" cy="330" rx="150" ry="140" fill="url(#auraGrad)" filter="url(#blur6)">
        <animate attributeName="opacity" values="0.85;1;0.8;1;0.85" dur="1.6s" repeatCount="indefinite"/>
      </ellipse>
      <g filter="url(#blur2)">
        <path d="M690,210 q-14,-40 6,-64 q4,30 16,52" fill="#ff8c1a" opacity="0.9">
          <animate attributeName="d" values="M690,210 q-14,-40 6,-64 q4,30 16,52;M690,210 q-10,-46 8,-70 q2,34 14,58;M690,210 q-14,-40 6,-64 q4,30 16,52" dur="1.1s" repeatCount="indefinite"/>
        </path>
        <path d="M720,208 q10,-36 -4,-62 q-8,28 -18,50" fill="#ffb43a" opacity="0.8">
          <animate attributeName="d" values="M720,208 q10,-36 -4,-62 q-8,28 -18,50;M722,208 q14,-42 -2,-68 q-10,32 -20,54;M720,208 q10,-36 -4,-62 q-8,28 -18,50" dur="1.4s" repeatCount="indefinite"/>
        </path>
      </g>
      <!-- wings -->
      <path d="M660,260 Q560,180 520,240 Q580,235 590,300 Q630,290 655,330 Z" fill="#3a1006" stroke="#1a0602" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" values="0 660 270; 10 660 270; 0 660 270" dur="3.6s" repeatCount="indefinite"/>
      </path>
      <path d="M760,260 Q860,180 900,240 Q840,235 830,300 Q790,290 765,330 Z" fill="#3a1006" stroke="#1a0602" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" values="0 760 270; -10 760 270; 0 760 270" dur="3.6s" repeatCount="indefinite"/>
      </path>
      <!-- body -->
      <path d="M665,270 Q640,300 645,360 Q650,420 675,455 L745,455 Q770,420 772,360 Q775,300 755,270 Z" fill="#241008" stroke="#0d0502" stroke-width="3"/>
      <!-- mane / shoulders fire -->
      <path d="M655,280 Q670,250 700,245 Q730,250 748,280 Q730,270 700,268 Q670,270 655,280 Z" fill="#c23a00">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="0.9s" repeatCount="indefinite"/>
      </path>
      <!-- head with horns -->
      <ellipse cx="702" cy="252" rx="34" ry="28" fill="#2c1208" stroke="#0d0502" stroke-width="3"/>
      <path d="M678,238 Q660,205 668,178 Q686,205 690,232 Z" fill="#7a3410" stroke="#1a0602" stroke-width="2"/>
      <path d="M726,238 Q744,205 736,178 Q718,205 714,232 Z" fill="#7a3410" stroke="#1a0602" stroke-width="2"/>
      <!-- burning eyes -->
      <circle cx="690" cy="248" r="4" fill="#ffdd44">
        <animate attributeName="opacity" values="1;0.5;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="716" cy="248" r="4" fill="#ffdd44">
        <animate attributeName="opacity" values="1;0.5;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <!-- legs -->
      <path d="M672,450 L664,500 L684,500 L692,455 Z" fill="#1c0c05"/>
      <path d="M746,450 L754,500 L734,500 L726,455 Z" fill="#1c0c05"/>
      <!-- sword of flame -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-8 750 340; 14 750 340; -8 750 340" dur="3.6s" repeatCount="indefinite"/>
        <rect x="746" y="330" width="10" height="22" fill="#1c0c05"/>
        <path d="M751,180 L760,335 L742,335 Z" fill="#ff9a2a">
          <animate attributeName="opacity" values="0.9;1;0.85;1;0.9" dur="0.8s" repeatCount="indefinite"/>
        </path>
        <path d="M751,215 L756,335 L746,335 Z" fill="#ffe08a" opacity="0.85"/>
      </g>
      <!-- arm reaching toward Gandalf -->
      <path d="M655,310 Q615,315 585,335 Q610,345 655,340 Z" fill="#241008" stroke="#0d0502" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" values="0 655 320; -14 655 320; 0 655 320" dur="3.6s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Gandalf: grey wizard, staff and sword, waving cloak -->
  <g id="gandalf">
    <animateTransform attributeName="transform" type="translate" values="0 0; 10 -3; 0 0" dur="3.6s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 260 430; 4 260 430; 0 260 430" dur="3.6s" repeatCount="indefinite"/>
      <!-- waving cloak behind -->
      <path d="M250,330 Q200,380 190,470 Q230,455 245,480 Q260,450 285,465 Q275,395 262,340 Z" fill="#4a4a52" stroke="#2a2a30" stroke-width="2">
        <animate attributeName="d" values="M250,330 Q200,380 190,470 Q230,455 245,480 Q260,450 285,465 Q275,395 262,340 Z;M250,330 Q190,385 175,475 Q225,460 242,485 Q262,455 290,462 Q272,392 262,340 Z;M250,330 Q200,380 190,470 Q230,455 245,480 Q260,450 285,465 Q275,395 262,340 Z" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <!-- robe -->
      <path d="M252,330 Q238,390 240,475 L285,475 Q290,390 275,330 Z" fill="#63636e" stroke="#3a3a42" stroke-width="2"/>
      <!-- beard and head -->
      <circle cx="262" cy="315" r="14" fill="#d8b090"/>
      <path d="M256,322 Q262,368 262,382 Q268,368 268,322 Z" fill="#d9d9dd"/>
      <path d="M250,306 Q262,300 274,306 L274,312 Q262,306 250,312 Z" fill="#7a7a82"/>
      <path d="M248,318 Q238,322 242,332 L252,326 Z" fill="#d9d9dd"/>
      <!-- sword arm thrust toward Balrog -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-4 275 350; 10 275 350; -4 275 350" dur="3.6s" repeatCount="indefinite"/>
        <path d="M272,350 Q310,345 340,355 L336,364 Q308,356 272,360 Z" fill="#63636e"/>
        <path d="M338,357 L400,350 L404,360 L338,366 Z" fill="#c8c8d2" stroke="#8a8a94" stroke-width="1"/>
        <rect x="334" y="346" width="6" height="24" rx="2" fill="#8a7434"/>
      </g>
      <!-- staff arm (raised) -->
      <g>
        <path d="M252,345 Q228,330 218,300 L228,294 Q240,322 258,338 Z" fill="#63636e"/>
        <!-- staff -->
        <rect x="219" y="180" width="6" height="160" rx="2" fill="#5a4428"/>
        <!-- pulsing staff glow -->
        <circle cx="222" cy="172" r="30" fill="url(#staffGlow)" filter="url(#blur2)">
          <animate attributeName="opacity" values="0.5;1;0.55;0.95;0.5" dur="2.2s" repeatCount="indefinite"/>
          <animate attributeName="r" values="26;34;26" dur="2.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="222" cy="172" r="8" fill="#ffffff">
          <animate attributeName="opacity" values="0.8;1;0.8" dur="2.2s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <!-- Foreground: warm rim light flicker over whole scene -->
  <rect width="900" height="600" fill="url(#auraGrad)" opacity="0.12" filter="url(#blur6)">
    <animate attributeName="opacity" values="0.08;0.16;0.09;0.15;0.08" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>