<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Sky and wood gradients -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc6f2"/>
      <stop offset="1" stop-color="#e6f3ff"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d2ad78"/>
      <stop offset="1" stop-color="#9a7146"/>
    </linearGradient>
    <!-- Motion path followed by the skateboard's contact point:
         left transition (R=200) -> flat -> right transition -> launch at right coping
         -> parabolic air (quadratic Bezier = ballistic arc) -> land below right coping
         -> back down right transition -> flat -> up left transition to the coping (rest) -->
    <path id="ride" d="M 100 230 A 200 200 0 0 0 300 430 L 500 430 A 200 200 0 0 0 700 230 Q 695 64 690 292 A 200 200 0 0 1 500 430 L 300 430 A 200 200 0 0 1 100 230"/>
  </defs>

  <!-- Background: sky, sun, ground -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="720" cy="70" r="34" fill="#ffe27a" opacity="0.9"/>
  <rect x="0" y="478" width="800" height="22" fill="#4b4b4b"/>

  <!-- Half-pipe: two quarter pipes (radius 200) facing each other with a 200px flat bottom -->
  <g id="halfpipe">
    <!-- Solid ramp body including the two top platforms (decks) -->
    <path d="M 40 226 L 100 226 L 100 230 A 200 200 0 0 0 300 430 L 500 430 A 200 200 0 0 0 700 230 L 700 226 L 760 226 L 760 480 L 40 480 Z" fill="url(#wood)"/>
    <!-- Support studs under the riding surface -->
    <g stroke="#6e4d2b" stroke-width="2" opacity="0.6">
      <line x1="100" y1="232" x2="100" y2="480"/>
      <line x1="200" y1="403" x2="200" y2="480"/>
      <line x1="300" y1="430" x2="300" y2="480"/>
      <line x1="400" y1="430" x2="400" y2="480"/>
      <line x1="500" y1="430" x2="500" y2="480"/>
      <line x1="600" y1="403" x2="600" y2="480"/>
      <line x1="700" y1="232" x2="700" y2="480"/>
    </g>
    <!-- Riding surface (masonite skin) -->
    <path d="M 100 230 A 200 200 0 0 0 300 430 L 500 430 A 200 200 0 0 0 700 230" fill="none" stroke="#f1e2c6" stroke-width="4"/>
    <!-- Platform decks -->
    <rect x="40" y="224" width="60" height="6" fill="#f1e2c6"/>
    <rect x="700" y="224" width="60" height="6" fill="#f1e2c6"/>
    <!-- Coping pipes at the lip of each quarter pipe -->
    <circle cx="98" cy="231" r="4.5" fill="#d9d9d9" stroke="#777" stroke-width="1.5"/>
    <circle cx="702" cy="231" r="4.5" fill="#d9d9d9" stroke="#777" stroke-width="1.5"/>
  </g>

  <!-- Skater: whole group translated along the ride path.
       keyPoints/keySplines encode pendulum physics: slow near the copings, fastest at the bottom,
       decelerating rise / accelerating fall in the air (parabola), short stall at the left lip. -->
  <g id="skater">
    <animateMotion dur="5.4s" repeatCount="indefinite" calcMode="spline"
      keyPoints="0;0.1749;0.2862;0.4610;0.5002;0.5740;0.7138;0.8251;1;1"
      keyTimes="0;0.1852;0.2519;0.4093;0.4944;0.6130;0.7148;0.7815;0.9667;1"
      keySplines="0.5 0 0.7 0.51;0.4 0.38 0.6 0.576;0.3 0.48 0.6 0.672;0.333 0.667 0.667 1;0.333 0 0.667 0.333;0.3 0.23 0.7 0.64;0.4 0.4 0.6 0.6;0.3 0.49 0.5 1;0 0 1 1">
      <mpath xlink:href="#ride" href="#ride"/>
    </animateMotion>

    <!-- Orientation group: rotates so the skater stays perpendicular to the ramp surface
         (horizontal at the vertical lips, upright on the flat), tilts slightly in the air
         and re-aligns with the surface angle at the landing point. -->
    <g id="orient">
      <animateTransform attributeName="transform" type="rotate" dur="5.4s" repeatCount="indefinite" calcMode="spline"
        values="90;0;0;-90;-84;-72;0;0;90;90"
        keyTimes="0;0.1852;0.2519;0.4093;0.4944;0.6130;0.7148;0.7815;0.9667;1"
        keySplines="0.5 0 0.7 0.51;0.4 0.38 0.6 0.576;0.3 0.48 0.6 0.672;0.333 0.667 0.667 1;0.333 0 0.667 0.333;0.3 0.23 0.7 0.64;0.4 0.4 0.6 0.6;0.3 0.49 0.5 1;0 0 1 1"/>

      <!-- Skateboard: drops away from the feet during the air and performs a kickflip
           (rotation about the deck's long axis, seen edge-on as a scaleY flip), then
           re-aligns flat under the feet before landing. -->
      <g id="board">
        <animateTransform attributeName="transform" type="translate" dur="5.4s" repeatCount="indefinite"
          values="0 0;0 0;0 10;0 10;0 0;0 0"
          keyTimes="0;0.4093;0.4352;0.5278;0.5648;1"/>
        <g transform="translate(0,-6)">
          <g id="flip">
            <animateTransform attributeName="transform" type="scale" dur="5.4s" repeatCount="indefinite"
              values="1 1;1 1;1 0.707;1 0.06;1 -0.707;1 -1;1 -0.707;1 0.06;1 0.707;1 1;1 1"
              keyTimes="0;0.4185;0.4347;0.4509;0.4671;0.4833;0.4995;0.5157;0.5319;0.5481;1"/>
            <g transform="translate(0,6)">
              <!-- Far wheels (rear pair, slightly offset) -->
              <circle cx="-19" cy="-5.5" r="3.5" fill="#bdbdbd" stroke="#555" stroke-width="1"/>
              <circle cx="25" cy="-5.5" r="3.5" fill="#bdbdbd" stroke="#555" stroke-width="1"/>
              <!-- Trucks -->
              <rect x="-25" y="-10" width="6" height="5" fill="#8a8a8a"/>
              <rect x="19" y="-10" width="6" height="5" fill="#8a8a8a"/>
              <!-- Deck with kicked nose and tail -->
              <path d="M -37 -17 Q -32 -9.5 -24 -9.5 L 24 -9.5 Q 32 -9.5 37 -17" fill="none" stroke="#6b3f1d" stroke-width="3.5" stroke-linecap="round"/>
              <path d="M -35 -16 Q -31 -11 -24 -11 L 24 -11 Q 31 -11 35 -16" fill="none" stroke="#1f1f1f" stroke-width="1.2" stroke-linecap="round"/>
              <!-- Near wheels (front pair) -->
              <circle cx="-22" cy="-4" r="4" fill="#f2f2f2" stroke="#444" stroke-width="1.2"/>
              <circle cx="22" cy="-4" r="4" fill="#f2f2f2" stroke="#444" stroke-width="1.2"/>
            </g>
          </g>
        </g>
      </g>

      <!-- Legs: knees bend/extend to pump the transitions, tuck in the air, absorb the landing -->
      <g id="legs" fill="none" stroke="#2b3a67" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="-16,-11 -23.5,-30.2 -6,-37">
          <animate attributeName="points" dur="5.4s" repeatCount="indefinite"
            keyTimes="0;0.0926;0.1852;0.2222;0.2519;0.3519;0.4093;0.4444;0.5185;0.5833;0.6130;0.6389;0.7148;0.75;0.7815;0.8889;0.9667;1"
            values="-16,-11 -23.5,-30.2 -6,-37;-16,-11 -21,-34 -6,-47;-16,-11 -19.5,-35.3 -6,-51;-16,-11 -23.8,-29.4 -6,-35;-16,-11 -23.1,-31 -6,-39;-16,-11 -20.2,-34.6 -6,-49;-16,-11 -18.6,-35.8 -6,-53;-16,-11 -24.9,-26 -6,-27;-16,-11 -25.1,-25.1 -6,-25;-16,-11 -21.6,-33.3 -6,-45;-16,-11 -21.6,-33.3 -6,-45;-16,-11 -24.4,-27.7 -6,-31;-16,-11 -20.2,-34.6 -6,-49;-16,-11 -23.5,-30.2 -6,-37;-16,-11 -23.1,-31 -6,-39;-16,-11 -20.2,-34.6 -6,-49;-16,-11 -22.6,-31.8 -6,-41;-16,-11 -23.5,-30.2 -6,-37"/>
        </polyline>
        <polyline points="16,-11 23.5,-30.2 6,-37">
          <animate attributeName="points" dur="5.4s" repeatCount="indefinite"
            keyTimes="0;0.0926;0.1852;0.2222;0.2519;0.3519;0.4093;0.4444;0.5185;0.5833;0.6130;0.6389;0.7148;0.75;0.7815;0.8889;0.9667;1"
            values="16,-11 23.5,-30.2 6,-37;16,-11 21,-34 6,-47;16,-11 19.5,-35.3 6,-51;16,-11 23.8,-29.4 6,-35;16,-11 23.1,-31 6,-39;16,-11 20.2,-34.6 6,-49;16,-11 18.6,-35.8 6,-53;16,-11 24.9,-26 6,-27;16,-11 25.1,-25.1 6,-25;16,-11 21.6,-33.3 6,-45;16,-11 21.6,-33.3 6,-45;16,-11 24.4,-27.7 6,-31;16,-11 20.2,-34.6 6,-49;16,-11 23.5,-30.2 6,-37;16,-11 23.1,-31 6,-39;16,-11 20.2,-34.6 6,-49;16,-11 22.6,-31.8 6,-41;16,-11 23.5,-30.2 6,-37"/>
        </polyline>
      </g>
      <!-- Shoes -->
      <ellipse cx="-16" cy="-11" rx="7" ry="3.5" fill="#222"/>
      <ellipse cx="16" cy="-11" rx="7" ry="3.5" fill="#222"/>

      <!-- Upper body (torso, arms, head): moves down/up with the crouch to pump and tuck -->
      <g id="upperBody">
        <animateTransform attributeName="transform" type="translate" dur="5.4s" repeatCount="indefinite"
          keyTimes="0;0.0926;0.1852;0.2222;0.2519;0.3519;0.4093;0.4444;0.5185;0.5833;0.6130;0.6389;0.7148;0.75;0.7815;0.8889;0.9667;1"
          values="0 18;0 8;0 4;0 20;0 16;0 6;0 2;0 28;0 30;0 10;0 10;0 24;0 6;0 18;0 16;0 6;0 14;0 18"/>
        <!-- Arms (raised for balance during the trick) -->
        <g fill="none" stroke="#f4c7a1" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="-9,-84 -21,-73 -29,-61">
            <animate attributeName="points" dur="5.4s" repeatCount="indefinite"
              keyTimes="0;0.4093;0.4722;0.5833;0.6130;1"
              values="-9,-84 -21,-73 -29,-61;-9,-84 -21,-73 -29,-61;-9,-84 -24,-84 -37,-86;-9,-84 -24,-84 -37,-86;-9,-84 -21,-73 -29,-61;-9,-84 -21,-73 -29,-61"/>
          </polyline>
          <polyline points="9,-84 21,-73 29,-61">
            <animate attributeName="points" dur="5.4s" repeatCount="indefinite"
              keyTimes="0;0.4093;0.4722;0.5833;0.6130;1"
              values="9,-84 21,-73 29,-61;9,-84 21,-73 29,-61;9,-84 24,-84 37,-86;9,-84 24,-84 37,-86;9,-84 21,-73 29,-61;9,-84 21,-73 29,-61"/>
          </polyline>
        </g>
        <!-- Torso (shirt) -->
        <rect x="-11" y="-88" width="22" height="36" rx="7" fill="#e63946"/>
        <!-- Neck and head -->
        <rect x="-3" y="-92" width="6" height="6" fill="#f4c7a1"/>
        <circle cx="0" cy="-99" r="9" fill="#f4c7a1"/>
        <!-- Helmet -->
        <path d="M -10 -99 A 10 10 0 0 1 10 -99 L 10 -97 L -10 -97 Z" fill="#1d1d1d"/>
        <!-- Face -->
        <circle cx="-3" cy="-97" r="1" fill="#333"/>
        <circle cx="3" cy="-97" r="1" fill="#333"/>
      </g>
    </g>
  </g>
</svg>