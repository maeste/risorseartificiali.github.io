<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450"
     aria-label="Skateboarder doing aerial tricks on a half-pipe">

  <!-- ================= PALETTE / GRADIENTS ================= -->
  <defs>
    <linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#5fb0de"/>
      <stop offset="65%" stop-color="#bee2f1"/>
      <stop offset="100%" stop-color="#e8f3e8"/>
    </linearGradient>
    <linearGradient id="g-ramp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#8a6a4c"/>
      <stop offset="100%" stop-color="#48362a"/>
    </linearGradient>
    <linearGradient id="g-surf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e6bd8b"/>
      <stop offset="100%" stop-color="#b3814f"/>
    </linearGradient>
    <linearGradient id="g-cope" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#8b959f"/>
    </linearGradient>
  </defs>

  <!-- ================= SKY, SUN, CLOUDS ================= -->
  <rect x="0" y="0" width="800" height="450" fill="url(#g-sky)"/>
  <circle cx="690" cy="70" r="30" fill="#fff6cc" opacity="0.85"/>
  <g fill="#ffffff" opacity="0.75">
    <ellipse cx="150" cy="80" rx="46" ry="18"/><ellipse cx="185" cy="70" rx="30" ry="20"/>
    <ellipse cx="115" cy="74" rx="26" ry="14"/>
    <ellipse cx="520" cy="55" rx="38" ry="14"/><ellipse cx="552" cy="48" rx="24" ry="16"/>
  </g>

  <!-- ================= GROUND / SKATE PARK FLOOR ================= -->
  <rect x="0" y="398" width="800" height="52" fill="#9aa39f"/>
  <rect x="0" y="398" width="800" height="4" fill="#7d857f"/>

  <!-- ================= HALF-PIPE STRUCTURE =================
       Two quarter pipes (R = 140) facing each other, joined by a 300px flat bottom.
       Left coping (110,220)  |  flat bottom y=360  |  right coping (690,220)          -->
  <g id="halfpipe">

    <!-- solid body of the ramp (below the riding surface) -->
    <path d="M20,220 L110,220 A140,140 0 0 0 250,360 L550,360 A140,140 0 0 0 690,220
             L780,220 L780,402 L20,402 Z" fill="url(#g-ramp)"/>

    <!-- internal framing / studs -->
    <g stroke="#382a20" stroke-width="3" opacity="0.45">
      <line x1="130" y1="292" x2="130" y2="400"/><line x1="170" y1="335" x2="170" y2="400"/>
      <line x1="200" y1="351" x2="200" y2="400"/><line x1="250" y1="360" x2="250" y2="400"/>
      <line x1="300" y1="360" x2="300" y2="400"/><line x1="350" y1="360" x2="350" y2="400"/>
      <line x1="400" y1="360" x2="400" y2="400"/><line x1="450" y1="360" x2="450" y2="400"/>
      <line x1="500" y1="360" x2="500" y2="400"/><line x1="550" y1="360" x2="550" y2="400"/>
      <line x1="600" y1="351" x2="600" y2="400"/><line x1="630" y1="335" x2="630" y2="400"/>
      <line x1="670" y1="292" x2="670" y2="400"/>
      <line x1="20"  y1="380" x2="780" y2="380"/>
    </g>

    <!-- plywood riding surface (the two transitions + flat bottom) -->
    <path d="M20,220 L110,220 A140,140 0 0 0 250,360 L550,360 A140,140 0 0 0 690,220 L780,220"
          fill="none" stroke="url(#g-surf)" stroke-width="9" stroke-linecap="round"/>
    <path d="M110,220 A140,140 0 0 0 250,360 L550,360 A140,140 0 0 0 690,220"
          fill="none" stroke="#f6ddb9" stroke-width="1.6" opacity="0.7"/>

    <!-- decks (platforms on top of each quarter pipe) -->
    <rect x="20"  y="216" width="90" height="6" fill="#6f5942"/>
    <rect x="690" y="216" width="90" height="6" fill="#6f5942"/>

    <!-- steel coping pipes at the lip of each quarter pipe -->
    <circle cx="110" cy="220" r="6" fill="url(#g-cope)" stroke="#5e666e" stroke-width="1"/>
    <circle cx="690" cy="220" r="6" fill="url(#g-cope)" stroke="#5e666e" stroke-width="1"/>

    <!-- platform safety railings -->
    <g stroke="#66707a" stroke-width="4" stroke-linecap="round" fill="none">
      <line x1="30" y1="216" x2="30" y2="150"/><line x1="74" y1="216" x2="74" y2="150"/>
      <line x1="24" y1="155" x2="86" y2="155"/><line x1="24" y1="185" x2="86" y2="185"/>
      <line x1="726" y1="216" x2="726" y2="150"/><line x1="770" y1="216" x2="770" y2="150"/>
      <line x1="714" y1="155" x2="776" y2="155"/><line x1="714" y1="185" x2="776" y2="185"/>
    </g>
  </g>

  <!-- ================= SKATER =================
       POSITION: animateMotion follows the exact ramp surface, then two straight
       vertical air segments above each coping (a vert launch is tangent to the
       vertical wall, so the projectile arc is a vertical rise-and-fall).
       SPEED: keyPoints/keyTimes are pre-integrated from energy conservation
       v = sqrt(2 g (h_apex - h)):  fast through the flat bottom, slow at the lip,
       and gravity-decelerated (dense samples near the apex) while airborne.       -->
  <g id="skater">
    <animateMotion dur="5.6s" repeatCount="indefinite" calcMode="linear"
      path="M110,220 A140,140 0 0 0 250,360 L550,360 A140,140 0 0 0 690,220
            L690,140 L690,220 A140,140 0 0 1 550,360 L250,360 A140,140 0 0 1 110,220
            L110,140 L110,220"
      keyPoints="0;0.0204;0.0407;0.0611;0.0815;0.1018;0.1222;0.2889;0.3093;0.3296;0.3500;0.3704;0.3907;0.4111;0.4305;0.4444;0.4528;0.4555;0.4583;0.4667;0.4805;0.5;0.5204;0.5407;0.5611;0.5815;0.6018;0.6222;0.7889;0.8093;0.8296;0.8500;0.8704;0.8907;0.9111;0.9305;0.9444;0.9528;0.9555;0.9583;0.9667;0.9805;1"
      keyTimes="0;0.0204;0.0380;0.0537;0.0683;0.0823;0.0959;0.2072;0.2209;0.2348;0.2495;0.2652;0.2827;0.3031;0.3278;0.3524;0.3770;0.4016;0.4262;0.4508;0.4754;0.5;0.5205;0.5380;0.5537;0.5683;0.5823;0.5959;0.7072;0.7209;0.7348;0.7495;0.7652;0.7827;0.8031;0.8278;0.8524;0.8770;0.9016;0.9262;0.9508;0.9754;1"/>

    <!-- BODY TILT: the rider stays perpendicular to the ramp surface
         (0 deg on the flat, +90 deg at the left lip, -90 deg at the right lip)
         and leans out slightly during each air, realigning for the landing. -->
    <g id="lean">
      <animateTransform attributeName="transform" type="rotate" dur="5.6s"
        repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.0204;0.0380;0.0537;0.0683;0.0823;0.0959;0.2072;0.2209;0.2348;0.2495;0.2652;0.2827;0.3031;0.3278;0.3524;0.3770;0.4016;0.4262;0.4508;0.4754;0.5;0.5205;0.5380;0.5537;0.5683;0.5823;0.5959;0.7072;0.7209;0.7348;0.7495;0.7652;0.7827;0.8031;0.8278;0.8524;0.8770;0.9016;0.9262;0.9508;0.9754;1"
        values="90;75;60;45;30;15;0;0;-15;-30;-45;-60;-75;-90;-96;-103;-108;-110;-108;-103;-96;-90;-75;-60;-45;-30;-15;0;0;15;30;45;60;75;90;96;103;108;110;108;103;96;90"/>

      <!-- ---------- SKATEBOARD (deck + 2 trucks + 4 wheels) ----------
           Board pivot sits 11px above the wheel-contact point. It spins a full
           360 (kickflip, shown in-plane) just after each launch and is caught
           and re-aligned well before touch-down. -->
      <g transform="translate(0,-11)">
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="5.6s"
            repeatCount="indefinite" calcMode="linear"
            keyTimes="0;0.32;0.43;0.82;0.93;1" values="0;0;360;360;720;720"/>

          <!-- far-side truck + 2 far wheels (offset for depth) -->
          <g transform="translate(5,-3)">
            <rect x="-22" y="0" width="9" height="2" fill="#5c646d"/>
            <rect x="13"  y="0" width="9" height="2" fill="#5c646d"/>
            <path d="M-21,2 L-14,2 L-15,6 L-20,6 Z" fill="#68727c"/>
            <path d="M14,2 L21,2 L20,6 L15,6 Z"     fill="#68727c"/>
            <circle cx="-18" cy="6" r="4.5" fill="#cbbfa9"/>
            <circle cx="18"  cy="6" r="4.5" fill="#cbbfa9"/>
          </g>

          <!-- deck (kicked nose + tail) with grip tape -->
          <path d="M-33,-5 L-24,0 L24,0 L33,-5 L33,-8 L24,-3 L-24,-3 L-33,-8 Z" fill="#b0472f"/>
          <path d="M-33,-8 L-24,-3 L24,-3 L33,-8" fill="none" stroke="#2b2b2b" stroke-width="2.4"/>
          <path d="M-20,-1 L20,-1" stroke="#f0d9a0" stroke-width="1" opacity="0.7"/>

          <!-- near-side trucks -->
          <rect x="-22" y="0" width="9" height="2" fill="#7f8a94"/>
          <rect x="13"  y="0" width="9" height="2" fill="#7f8a94"/>
          <path d="M-21,2 L-14,2 L-15,6 L-20,6 Z" fill="#9aa5af"/>
          <path d="M14,2 L21,2 L20,6 L15,6 Z"     fill="#9aa5af"/>
          <line x1="-25" y1="6" x2="-11" y2="6" stroke="#9aa5af" stroke-width="2"/>
          <line x1="11"  y1="6" x2="25"  y2="6" stroke="#9aa5af" stroke-width="2"/>

          <!-- near-side wheels (wheels 3 and 4) -->
          <circle cx="-18" cy="6" r="5" fill="#f2ead9" stroke="#b9ad95" stroke-width="1"/>
          <circle cx="18"  cy="6" r="5" fill="#f2ead9" stroke="#b9ad95" stroke-width="1"/>
          <circle cx="-18" cy="6" r="1.8" fill="#7d7362"/>
          <circle cx="18"  cy="6" r="1.8" fill="#7d7362"/>
        </g>
      </g>

      <!-- ---------- RIDER: legs ---------- -->
      <g fill="none" stroke="#35507d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="-17,-18 -13,-33 -1,-47"/>
        <polyline points="17,-18 18,-33 2,-47"/>
      </g>

      <!-- ---------- RIDER: shoes on the deck ---------- -->
      <rect x="-25" y="-19" width="16" height="5" rx="2" fill="#22252b"/>
      <rect x="9"   y="-19" width="16" height="5" rx="2" fill="#22252b"/>

      <!-- ---------- RIDER: torso ---------- -->
      <line x1="0" y1="-46" x2="4" y2="-68" stroke="#e6533a" stroke-width="18" stroke-linecap="round"/>
      <line x1="0" y1="-49" x2="4" y2="-60" stroke="#f4886f" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

      <!-- ---------- RIDER: trailing arm (balance) ---------- -->
      <g transform="translate(2,-66)">
        <animateTransform attributeName="transform" type="rotate" dur="5.6s"
          repeatCount="indefinite" calcMode="linear"
          keyTimes="0;0.30;0.35;0.46;0.51;0.80;0.85;0.96;1"
          values="0;0;-28;-28;0;0;-28;-28;0"/>
        <polyline points="0,0 -13,-4 -21,-11" fill="none" stroke="#f0c49b"
                  stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="-21" cy="-11" r="3.6" fill="#f0c49b"/>
      </g>

      <!-- ---------- RIDER: leading arm (drops for the grab in the air) ---------- -->
      <g transform="translate(4,-66)">
        <animateTransform attributeName="transform" type="rotate" dur="5.6s"
          repeatCount="indefinite" calcMode="linear"
          keyTimes="0;0.30;0.35;0.46;0.51;0.80;0.85;0.96;1"
          values="0;0;38;38;0;0;38;38;0"/>
        <polyline points="0,0 13,7 21,1" fill="none" stroke="#f0c49b"
                  stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="21" cy="1" r="3.6" fill="#f0c49b"/>
      </g>

      <!-- ---------- RIDER: head + helmet ---------- -->
      <line x1="5" y1="-70" x2="6" y2="-74" stroke="#f0c49b" stroke-width="7" stroke-linecap="round"/>
      <circle cx="7" cy="-77" r="8.5" fill="#f0c49b"/>
      <circle cx="12" cy="-77.5" r="1.2" fill="#3a2b22"/>
      <path d="M-3,-78 A10,10 0 0 1 17,-78 Z" fill="#33405e"/>
      <path d="M-3,-78 L-8,-75.5 L-2,-74.5 Z" fill="#33405e"/>
      <path d="M2,-86 A9,9 0 0 1 13,-85" fill="none" stroke="#66759c" stroke-width="2" opacity="0.8"/>
    </g>
  </g>

  <!-- ================= FOREGROUND DETAIL ================= -->
  <g opacity="0.9">
    <rect x="0" y="430" width="800" height="20" fill="#8b938f"/>
  </g>
</svg>