<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      #skater-translate {
        animation: moveTranslate 5s linear infinite;
      }
      #skater-rotate {
        animation: moveRotate 5s linear infinite;
      }
      #board {
        animation: kickflip 5s linear infinite;
        transform-origin: 0px -15px;
      }
      @keyframes moveTranslate {
        0% { transform: translate(100px, 300px); animation-timing-function: ease-in; }
        6% { transform: translate(158.6px, 441.4px); animation-timing-function: ease-in; }
        12% { transform: translate(300px, 500px); animation-timing-function: linear; }
        18% { transform: translate(500px, 500px); animation-timing-function: ease-out; }
        24% { transform: translate(641.4px, 441.4px); animation-timing-function: ease-out; }
        30% { transform: translate(700px, 300px); animation-timing-function: ease-out; }
        40% { transform: translate(700px, 177.5px); animation-timing-function: ease-in; }
        50% { transform: translate(700px, 300px); animation-timing-function: ease-in; }
        56% { transform: translate(641.4px, 441.4px); animation-timing-function: ease-in; }
        62% { transform: translate(500px, 500px); animation-timing-function: linear; }
        68% { transform: translate(300px, 500px); animation-timing-function: ease-out; }
        74% { transform: translate(158.6px, 441.4px); animation-timing-function: ease-out; }
        80% { transform: translate(100px, 300px); animation-timing-function: ease-out; }
        90% { transform: translate(100px, 177.5px); animation-timing-function: ease-in; }
        100% { transform: translate(100px, 300px); }
      }
      @keyframes moveRotate {
        0% { transform: rotate(90deg); animation-timing-function: ease-in; }
        6% { transform: rotate(45deg); animation-timing-function: ease-in; }
        12% { transform: rotate(0deg); animation-timing-function: linear; }
        18% { transform: rotate(0deg); animation-timing-function: ease-out; }
        24% { transform: rotate(-45deg); animation-timing-function: ease-out; }
        30% { transform: rotate(-90deg); animation-timing-function: linear; }
        40% { transform: rotate(90deg); animation-timing-function: linear; }
        50% { transform: rotate(270deg); animation-timing-function: linear; }
        56% { transform: rotate(315deg); animation-timing-function: linear; }
        62% { transform: rotate(360deg); animation-timing-function: linear; }
        68% { transform: rotate(360deg); animation-timing-function: ease-out; }
        74% { transform: rotate(405deg); animation-timing-function: ease-out; }
        80% { transform: rotate(450deg); animation-timing-function: linear; }
        90% { transform: rotate(630deg); animation-timing-function: linear; }
        100% { transform: rotate(810deg); }
      }
      @keyframes kickflip {
        0% { transform: rotate(0deg); animation-timing-function: linear; }
        30% { transform: rotate(0deg); animation-timing-function: linear; }
        50% { transform: rotate(360deg); animation-timing-function: linear; }
        80% { transform: rotate(360deg); animation-timing-function: linear; }
        100% { transform: rotate(720deg); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#e0f0ff" />

  <!-- Halfpipe surface -->
  <path d="M 100 300 C 100 410.456, 189.544 500, 300 500 L 500 500 C 610.456 500, 700 410.456, 700 300" 
        stroke="#333" stroke-width="20" fill="none" stroke-linecap="round" />
  
  <!-- Coping -->
  <circle cx="100" cy="300" r="12" fill="#555" />
  <circle cx="700" cy="300" r="12" fill="#555" />
  
  <!-- Bottom flat highlight -->
  <line x1="300" y1="500" x2="500" y2="500" stroke="#666" stroke-width="4" />

  <!-- Skater -->
  <g id="skater-translate">
    <g id="skater-rotate">
      <!-- Skateboard -->
      <g id="board">
        <!-- Wheels -->
        <circle cx="-20" cy="-5" r="5" fill="#222" />
        <circle cx="20" cy="-5" r="5" fill="#222" />
        <!-- Deck -->
        <rect x="-35" y="-20" width="70" height="10" rx="4" fill="#cc3333" />
        <rect x="-30" y="-18" width="60" height="6" rx="2" fill="#ff6666" />
      </g>
      <!-- Man -->
      <g id="man">
        <!-- Head -->
        <circle cx="0" cy="-100" r="12" fill="#ffcc99" />
        <!-- Body -->
        <rect x="-12" y="-88" width="24" height="48" rx="6" fill="#3366cc" />
        <!-- Arms -->
        <line x1="-12" y1="-80" x2="-30" y2="-60" stroke="#3366cc" stroke-width="6" stroke-linecap="round" />
        <line x1="12" y1="-80" x2="30" y2="-60" stroke="#3366cc" stroke-width="6" stroke-linecap="round" />
        <!-- Legs -->
        <line x1="-6" y1="-40" x2="-15" y2="-20" stroke="#333" stroke-width="8" stroke-linecap="round" />
        <line x1="6" y1="-40" x2="15" y2="-20" stroke="#333" stroke-width="8" stroke-linecap="round" />
        <!-- Feet -->
        <rect x="-25" y="-20" width="15" height="6" rx="2" fill="#333" />
        <rect x="10" y="-20" width="15" height="6" rx="2" fill="#333" />
      </g>
    </g>
  </g>
</svg>