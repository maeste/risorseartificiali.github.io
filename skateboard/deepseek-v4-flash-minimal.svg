<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F0FF"/>
    </linearGradient>
    <!-- Pipe gradient -->
    <linearGradient id="pipeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#888"/>
      <stop offset="30%" stop-color="#AAA"/>
      <stop offset="50%" stop-color="#999"/>
      <stop offset="70%" stop-color="#777"/>
      <stop offset="100%" stop-color="#555"/>
    </linearGradient>
  </defs>

  <!-- Background sky -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="680" cy="80" r="45" fill="#FFD700" opacity="0.9"/>
  <circle cx="680" cy="80" r="55" fill="#FFD700" opacity="0.2"/>

  <!-- Clouds -->
  <g opacity="0.8">
    <ellipse cx="150" cy="70" rx="60" ry="25" fill="white"/>
    <ellipse cx="190" cy="60" rx="40" ry="20" fill="white"/>
    <ellipse cx="120" cy="65" rx="35" ry="18" fill="white"/>
  </g>
  <g opacity="0.6">
    <ellipse cx="500" cy="100" rx="50" ry="20" fill="white"/>
    <ellipse cx="540" cy="90" rx="35" ry="18" fill="white"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="500" width="800" height="100" fill="#8B7355"/>
  <rect x="0" y="500" width="800" height="5" fill="#7A6548"/>

  <!-- Pipe ramp -->
  <path d="M 0 500 Q 200 350 400 350 Q 600 350 800 500" fill="url(#pipeGrad)" stroke="#666" stroke-width="3"/>
  <!-- Pipe top highlight -->
  <path d="M 0 500 Q 200 350 400 350 Q 600 350 800 500" fill="none" stroke="#CCC" stroke-width="2" opacity="0.5"/>
  <!-- Pipe inner curve -->
  <path d="M 50 500 Q 225 380 400 380 Q 575 380 750 500" fill="#7A6B5A" stroke="#555" stroke-width="2"/>
  <!-- Pipe bottom -->
  <path d="M 0 500 Q 200 350 400 350 Q 600 350 800 500" fill="none" stroke="#555" stroke-width="4"/>

  <!-- Half-pipe transition markings -->
  <line x1="400" y1="350" x2="400" y2="500" stroke="#666" stroke-width="1" stroke-dasharray="5,5" opacity="0.3"/>

  <!-- SKATEBOARDER ANIMATION -->
  <g transform="translate(0, 0)">
    <!-- Main animated group - moves along the pipe -->
    <g>
      <animateTransform attributeName="transform" type="translate" 
        values="0,0; 0,0; 100,-30; 250,-80; 350,-50; 400,0; 350,-50; 250,-80; 100,-30; 0,0; 0,0" 
        dur="6s" repeatCount="indefinite"/>

      <!-- Skateboard -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0,0,0; 0,0,0; 5,0,0; 15,0,0; 10,0,0; 0,0,0; -10,0,0; -15,0,0; -5,0,0; 0,0,0; 0,0,0"
          dur="6s" repeatCount="indefinite"/>

        <!-- Board -->
        <rect x="-45" y="0" width="90" height="8" rx="4" fill="#D2691E"/>
        <rect x="-45" y="0" width="90" height="3" rx="2" fill="#E8832A" opacity="0.6"/>
        <!-- Board grip tape -->
        <rect x="-43" y="0" width="86" height="2" rx="1" fill="#222" opacity="0.5"/>

        <!-- Wheels -->
        <circle cx="-30" cy="12" r="5" fill="#333"/>
        <circle cx="-30" cy="12" r="2" fill="#666"/>
        <circle cx="30" cy="12" r="5" fill="#333"/>
        <circle cx="30" cy="12" r="2" fill="#666"/>

        <!-- Trucks -->
        <rect x="-33" y="7" width="6" height="3" rx="1" fill="#888"/>
        <rect x="27" y="7" width="6" height="3" rx="1" fill="#888"/>
      </g>

      <!-- Skater body -->
      <g>
        <!-- Shadow under skater on pipe -->
        <ellipse cx="0" cy="18" rx="50" ry="5" fill="rgba(0,0,0,0.15)"/>

        <!-- Left leg (back) -->
        <line x1="-15" y1="-15" x2="-20" y2="2" stroke="#2A2A6B" stroke-width="6" stroke-linecap="round">
          <animate attributeName="x2" values="-20;-20;-25;-28;-25;-20;-15;-20;-20" dur="6s" repeatCount="indefinite"/>
          <animate attributeName="y2" values="2;2;-5;-10;-5;2;8;2;2" dur="6s" repeatCount="indefinite"/>
        </line>

        <!-- Right leg (front) -->
        <line x1="0" y1="-15" x2="20" y2="2" stroke="#2A2A6B" stroke-width="6" stroke-linecap="round">
          <animate attributeName="x2" values="20;20;28;35;28;20;15;20;20" dur="6s" repeatCount="indefinite"/>
          <animate attributeName="y2" values="2;2;-5;-10;-5;2;8;2;2" dur="6s" repeatCount="indefinite"/>
        </line>

        <!-- Torso -->
        <line x1="-7" y1="-50" x2="-5" y2="-15" stroke="#FF6347" stroke-width="8" stroke-linecap="round">
          <animate attributeName="x2" values="-5;-5;-8;-12;-8;-5;0;-5;-5" dur="6s" repeatCount="indefinite"/>
        </line>

        <!-- Head -->
        <circle cx="-5" cy="-60" r="12" fill="#FFDAB9">
          <animate attributeName="cx" values="-5;-5;-8;-12;-8;-5;-2;-5;-5" dur="6s" repeatCount="indefinite"/>
          <animate attributeName="cy" values="-60;-60;-63;-65;-63;-60;-58;-60;-60" dur="6s" repeatCount="indefinite"/>
        </circle>

        <!-- Hair -->
        <path d="M -17 -65 Q -15 -72 -5 -72 Q 5 -72 7 -65" fill="#4A2800"/>

        <!-- Eyes -->
        <circle cx="-8" cy="-62" r="1.5" fill="#333"/>
        <circle cx="-2" cy="-62" r="1.5" fill="#333"/>

        <!-- Mouth -->
        <path d="M -8 -57 Q -5 -55 -2 -57" fill="none" stroke="#333" stroke-width="1"/>

        <!-- Left arm (back, for balance) -->
        <line x1="-12" y1="-45" x2="-35" y2="-55" stroke="#FFDAB9" stroke-width="4" stroke-linecap="round">
          <animate attributeName="x2" values="-35;-35;-40;-45;-40;-35;-30;-35;-35" dur="6s" repeatCount="indefinite"/>
          <animate attributeName="y2" values="-55;-55;-50;-48;-50;-55;-58;-55;-55" dur="6s" repeatCount="indefinite"/>
        </line>

        <!-- Right arm (reaching out) -->
        <line x1="3" y1="-45" x2="30" y2="-50" stroke="#FFDAB9" stroke-width="4" stroke-linecap="round">
          <animate attributeName="x2" values="30;30;35;40;35;30;25;30;30" dur="6s" repeatCount="indefinite"/>
          <animate attributeName="y2" values="-50;-50;-45;-42;-45;-50;-55;-50;-50" dur="6s" repeatCount="indefinite"/>
        </line>

        <!-- Shirt detail -->
        <rect x="-12" y="-42" width="14" height="5" rx="2" fill="#FF4444" opacity="0.5"/>

        <!-- Shoes -->
        <ellipse cx="-20" cy="4" rx="8" ry="4" fill="#222" opacity="0.8">
          <animate attributeName="cx" values="-20;-20;-25;-28;-25;-20;-15;-20;-20" dur="6s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="20" cy="4" rx="8" ry="4" fill="#222" opacity="0.8">
          <animate attributeName="cx" values="20;20;28;35;28;20;15;20;20" dur="6s" repeatCount="indefinite"/>
        </ellipse>
      </g>
    </g>
  </g>

  <!-- Ollie animation text -->
  <text x="400" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#555">
    Skateboarding pipe tricks
  </text>

  <!-- Motion lines when moving fast -->
  <g opacity="0.3">
    <line x1="350" y1="380" x2="320" y2="390" stroke="#888" stroke-width="2">
      <animate attributeName="opacity" values="0;0;0.5;0.8;0.5;0;0;0;0" dur="6s" repeatCount="indefinite"/>
    </line>
    <line x1="360" y1="370" x2="325" y2="375" stroke="#888" stroke-width="1.5">
      <animate attributeName="opacity" values="0;0;0.4;0.7;0.4;0;0;0;0" dur="6s" repeatCount="indefinite"/>
    </line>
    <line x1="355" y1="390" x2="330" y2="400" stroke="#888" stroke-width="1.5">
      <animate attributeName="opacity" values="0;0;0.3;0.6;0.3;0;0;0;0" dur="6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Small decorative elements -->
  <rect x="100" y="495" width="30" height="5" rx="2" fill="#6B5B3E" opacity="0.5"/>
  <rect x="300" y="495" width="20" height="4" rx="2" fill="#6B5B3E" opacity="0.3"/>
  <rect x="550" y="495" width="25" height="5" rx="2" fill="#6B5B3E" opacity="0.4"/>
  <rect x="650" y="495" width="15" height="3" rx="2" fill="#6B5B3E" opacity="0.3"/>

  <!-- Grass tufts -->
  <g fill="#5D8A3C" opacity="0.6">
    <path d="M 50 500 Q 52 490 55 500"/>
    <path d="M 200 500 Q 202 488 205 500"/>
    <path d="M 450 500 Q 452 492 455 500"/>
    <path d="M 600 500 Q 602 490 605 500"/>
    <path d="M 720 500 Q 722 491 725 500"/>
  </g>
</svg>